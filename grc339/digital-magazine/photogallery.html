<!doctype html>
    <html lang="en">
        <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" /> <!-- You need this to proper scale in actual mobile devices.-->
            <title>Photogallery</title> 
            <link rel="stylesheet" href="https://use.typekit.net/lfc7oic.css">
            <link rel="stylesheet" type="text/css" href="style.css">

            <!-- Helpful meta tags to fight GitHub aggresive caching-->
                <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
                <meta http-equiv="Pragma" content="no-cache" />
                <meta http-equiv="Expires" content="0" />
            
        </head>	

        <body>
            <div class="photo-gallery-container">
                
                <header>
                    <h1><a href="index.html"><img src="Ramona Drive logo.svg" alt="logo."></a></h1>
                    <nav>
                        <ul>
                            <li class="nav"><a href="#">Metalcore</a></li>
                            <li class="nav"><a href="#">Deathcore</a></li>
                            <li class="nav"><a href="#">2000s Rock</a></li>
                            <li class="nav"><a href="#">Music Festivals</a></li>
                            <li class="nav"><a href="photogallery.html">Wacken Photo Gallery</a></li>
                            <li class="nav"><a href="newsletter.html">Subscribe to our newsletter</a></li>
                        </ul>
                    </nav>
                </header>   
                
                <div class="photo-gallery-container">
                    
                    <input type="radio" name="item" id="photo1" checked="checked">
                    <input type="radio" name="item" id="photo2">
                    <input type="radio" name="item" id="photo3">
                    <input type="radio" name="item" id="photo4">
                    <input type="radio" name="item" id="photo5">
                    <input type="radio" name="item" id="photo6">
                    <input type="radio" name="item" id="photo7">
                    <input type="radio" name="item" id="photo8">
                    
                    <h1 class="photo-gallery-title">Wacken Photo Gallery</h1>
                    
                    <main class="photo-gallery-main">
                        <figure class="photo-gallery-main">
                            <img src="Wacken 1.jpeg" alt="Night view of Wacken stage.">
                            <figcaption class="photo-gallery-figcaption">2018</figcaption> 
                        </figure>
                        <figure class="photo-gallery-main">
                            <img src="Wacken 2.jpeg" alt="Afternoon view of Wacken stage.">
                            <figcaption class="photo-gallery-figcaption">2019</figcaption> 
                        </figure>
                        <figure class="photo-gallery-main">
                            <img src="Wacken 3.jpeg" alt="Stage point of view of Wacken crowd." > 
                            <figcaption class="photo-gallery-figcaption">2020</figcaption>  
                        </figure>
                        <figure class="photo-gallery-main">
                            <img src="Wacken 4.jpeg" alt="Drone photograph of Wacken stage and crowd.">
                            <figcaption class="photo-gallery-figcaption">2021</figcaption> 
                        </figure>
                        <figure class="photo-gallery-main">
                            <img src="Wacken 5.jpg" alt="Daytime drone point of view photograph of Wacken crowd.">
                            <figcaption class="photo-gallery-figcaption">2022</figcaption> 
                        </figure>
                        <figure class="photo-gallery-main">
                            <img src="Wacken 6.jpeg" alt="Daytime drone point of view of wacken stage and crowd.">
                            <figcaption class="photo-gallery-figcaption">2023</figcaption> 
                        </figure>
                        <figure class="photo-gallery-main">
                            <img src="Wacken 7.jpg" alt="Wacken crowd photograph." > 
                            <figcaption class="photo-gallery-figcaption">2024</figcaption>  
                        </figure>
                        <figure class="photo-gallery-main">
                            <img src="Wacken 8.jpeg" alt="Wacken admission gate photograph of crowd.">
                            <figcaption class="photo-gallery-figcaption">2025</figcaption> 
                        </figure>
                    </main>
                    
                    <nav class="photo-gallery-nav">
                        <label for="photo1">
                            <img src="Wacken 1.jpeg" alt="Night view of Wacken stage.">
                        </label>
                        <label for="photo2">
                            <img src="Wacken 2.jpeg" alt="Afternoon view of Wacken stage.">
                        </label>
                        <label for="photo3">
                            <img src="Wacken 3.jpeg" alt="Stage point of view of Wacken crowd.">
                        </label>
                        <label for="photo4">
                            <img src="Wacken 4.jpeg" alt="Drone photograph of Wacken stage and crowd.">
                        </label>
                        <label for="photo5">
                            <img src="Wacken 5.jpg" alt="Daytime drone point of view photograph of Wacken crowd.">
                        </label>
                        <label for="photo6">
                            <img src="Wacken 6.jpeg" alt="Wacken stage photograph.">
                        </label>
                        <label for="photo7">
                            <img src="Wacken 7.jpg" alt="Wacken crowd photograph.">
                        </label>
                        <label for="photo8">
                            <img src="Wacken 8.jpeg" alt="Wacken admission gate photograph of crowd.">
                        </label>
                    </nav>
                                    
                </div>

                <footer>
                    <p>All rights reserved.</p>
                </footer>

            </div>
        </body>
    </html>
